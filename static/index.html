<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YouTube 配信 URL 自動セット</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main>
      <h1>YouTube 配信 URL 自動セット</h1>
      <p class="lead">YouTube で配信を始めると、わんコメの YouTube 枠の URL を配信中の枠に書き換えます。わんコメ公式・YouTube とは関係のない非公式プラグインです。</p>

      <section class="status" id="status" aria-live="polite">
        <span class="badge" id="status-badge">読み込み中</span>
        <span id="status-message"></span>
        <a id="status-video" target="_blank" rel="noopener noreferrer" hidden></a>
      </section>

      <form id="form" autocomplete="off">
        <label class="switch">
          <input type="checkbox" id="enabled" />
          <span>自動セットを使う</span>
        </label>

        <label for="apiKey">YouTube Data API キー</label>
        <input type="password" id="apiKey" spellcheck="false" />
        <p class="hint" id="apiKey-hint">Google Cloud で発行したキー。保存後は画面に表示されません。</p>
        <label class="inline"><input type="checkbox" id="clearApiKey" /> 保存済みのキーを消す</label>

        <label for="channel">チャンネル</label>
        <input type="text" id="channel" placeholder="@ハンドル または チャンネル URL" spellcheck="false" />

        <label for="serviceId">書き換えるわんコメの枠</label>
        <div class="row">
          <select id="serviceId"></select>
          <button type="button" id="reload-services" class="sub">一覧を更新</button>
        </div>
        <p class="hint">YouTube の枠を選んでください。他のサイトの枠は書き換えません。</p>

        <label for="intervalSec">確認する間隔（秒、60 以上）</label>
        <input type="number" id="intervalSec" min="60" max="3600" step="1" />
        <p class="hint">1 回の確認で YouTube API の利用枠を 2 使います（60 秒ごとで 1 日 2,880 / 上限 10,000）。</p>

        <div class="actions">
          <button type="submit" id="save">保存</button>
          <button type="button" id="check" class="sub">今すぐ確認</button>
        </div>
        <p class="message" id="message" role="status"></p>
      </form>

      <footer>
        <p>公開の配信のみ対象です（限定公開の枠は見つけられません）。</p>
      </footer>
    </main>
    <script src="./settings.js"></script>
  </body>
</html>
