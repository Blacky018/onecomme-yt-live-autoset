<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="base.css">
<style>
  .panel { top: 360px; height: 670px; padding: 40px 44px; display: flex; flex-direction: column; gap: 26px; }
  .step { display: flex; align-items: center; gap: 28px; background: #f3f6fc; border-radius: 26px; padding: 34px 30px; }
  .n {
    flex: none; width: 110px; height: 110px; border-radius: 50%; background: var(--main); color: #fff;
    display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 64px;
    box-shadow: 0 6px 0 var(--main-d);
  }
  .t { font-weight: 900; font-size: 46px; line-height: 1.25; }
  .t small { display: block; margin-top: 6px; font-weight: 700; font-size: 28px; color: var(--gray); line-height: 1.4; }
  .step.last { background: #fff7d1; }
  .step.last .n { background: var(--yellow); color: var(--navy); box-shadow: 0 6px 0 #d9b800; }
  .note {
    position: absolute; left: 0; right: 0; top: 1078px; text-align: center;
    color: #fff; font-weight: 900; font-size: 34px;
  }
  .note em { font-style: normal; color: var(--yellow); }
</style>
</head>
<body>
  <div class="head">
    <span class="no">はじめ方</span>
    <h1>準備は最初の 1 回だけ</h1>
    <p>画像つきの設定マニュアルで、順番に進めるだけ</p>
  </div>
  <div class="panel">
    <div class="step"><div class="n">1</div><div class="t">わんコメにプラグインを入れる<small>zip を展開して、プラグインフォルダに入れる</small></div></div>
    <div class="step"><div class="n">2</div><div class="t">Google でログインする<small>Google Cloud でログイン用の設定を作る（無料）</small></div></div>
    <div class="step last"><div class="n">3</div><div class="t">あとは配信するだけ<small>配信を始めたら、わんコメが自動でつながる</small></div></div>
  </div>
  <div class="note">設定は <em>20〜30 分</em>ほど ・ <em>クレジットカード不要</em></div>
  <div class="foot">非公式 ・ りーと</div>
</body>
</html>
